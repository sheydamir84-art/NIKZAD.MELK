 <h3 class="full">اطلاعات تماس</h3>${inp("شماره تلفن","c1",c.phone,'dir="ltr" inputmode="tel"')}${inp("شماره واتساپ با کد کشور (اختیاری، مثل 989134119881)","c2",c.wa,'dir="ltr"')}${inp("ایمیل","c3",c.email,'dir="ltr" type="email"')}${inp("اینستاگرام (بدون @)","c4",c.ig,'dir="ltr"')}${inp("آدرس دفتر (فارسی)","c5",c.addr[0])}${inp("آدرس دفتر (انگلیسی)","c6",c.addr[1],'dir="ltr"')}
 ${CLOUD?"":`<h3 class="full">تغییر رمز</h3>${inp("رمز جدید (خالی = بدون تغییر، حداقل ۸ کاراکتر)","s3","",'type="password" dir="ltr" autocomplete="new-password"',"full")}`}
 <p class="err full" id="se" role="alert"></p><div class="full ra"><button class="btn" type="submit">ذخیره و انتشار</button></div></form>
 <h3 style="margin-top:22px">پشتیبان‌گیری</h3><p class="sub">${CLOUD?"داده‌ها روی سرور ذخیره می‌شوند؛ این بخش برای دریافت نسخه‌ی پشتیبان است.":"حالت محلی: تغییرات فقط در همین مرورگر ذخیره می‌شود و بازدیدکنندگان دیگر آن را نمی‌بینند. برای نمایش عمومی تغییرات، حالت ابری (Supabase) را فعال کنید یا فایل را پس از ویرایش دوباره در هاست آپلود کنید. رمز محلی فقط یک قفل ظاهری است و امنیت واقعی نیست."}</p>

 $("#s1").oninput=e=>{const u=fixUrl(e.target.value),q=$("#hp");if(safeUrl(u)){q.src=u;q.style.display=""}else q.style.display="none"};
 $("#sf").onsubmit=async e=>{e.preventDefault();const se=$("#se");const h=fixUrl($("#s1").value);if(h&&!safeUrl(h)){se.textContent="لینک تصویر نامعتبر است.";return}
  const p=$("#s3")?$("#s3").value:"";if(p&&p.length<8){se.textContent="رمز باید حداقل ۸ کاراکتر باشد.";return}
  const ph=nd($("#c1").value).replace(/[^\d+]/g,"");if(ph.length<7){se.textContent="شماره تلفن معتبر نیست.";return}
  db.hero=h;db.stats=[0,1,2,3].map(i=>num($("#st"+i).value));
  db.content={...db.content,contact:{phone:ph,wa:nd($("#c2").value).replace(/\D/g,""),email:$("#c3").value.trim(),ig:$("#c4").value.trim().replace(/^@/,""),addr:[$("#c5").value.trim(),$("#c6").value.trim()||$("#c5").value.trim()]}};
  if(p){db.auth.salt=newSalt();db.auth.h=await hashPw(p,db.auth.salt)}
  await commit("تنظیمات ذخیره و اعمال شد.")};
 $("#bx").onclick=()=>{const{auth,lock,...d}=db;dl(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}),"nikzad-backup-"+new Date().toISOString().slice(0,10)+".json")};
 $("#bi").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.listings))throw 0;
  db={...db,listings:d.listings.map(l=>({...L0,...l})),hero:d.hero||"",stats:d.stats||db.stats,txt:d.txt||{},content:{...DEF_CONTENT,...(d.content||{}),contact:{...DEF_CONTENT.contact,...((d.content||{}).contact||{})}}};
  await commit("پشتیبان بازگردانی شد.")}catch(x){flash("فایل پشتیبان معتبر نیست.")}};
 $("#br").onclick=async()=>{if(confirm("همه ملک‌ها و متن‌ها به حالت اولیه برگردد؟ (رمز حفظ می‌شود)")){const a=db.auth,r=db.reqs;db={...DEF,auth:a,reqs:r,lock:{n:0,until:0}};await commit("بازنشانی انجام شد.");tabS(w)}}}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
 const a=e.target.closest("[data-d],[data-v],[data-x],[data-deal],[data-pre],[data-c],[data-g],[data-share]");if(!a)return;const D=a.dataset;
 if(D.d){deal=D.d;render()}
 if(D.deal){deal=D.deal;render()}
 if(D.v)view(D.v);
 if(D.g){let m=$("#mi");if(!m){m=document.createElement("img");m.id="mi";m.alt="";$(".mi").appendChild(m)}m.src=D.g;$$(".thumbs button").forEach(b=>b.setAttribute("aria-current",b==a))}
 if(D.share){const u=location.href.split("#")[0]+"#l-"+D.share;if(navigator.share)navigator.share({url:u,title:document.title}).catch(()=>{});else{try{await navigator.clipboard.writeText(u);toast(t("copied"))}catch(x){prompt("",u)}}}
 if(D.pre){const l=db.listings.find(x=>x.id==D.pre);if(l){$("#r1").value=l.cat;reqRef=P(l.t)+" (#"+l.id+")";$("#r4").value=(lang=="fa"?"درباره: ":"About: ")+P(l.t)}
  const m=$(".modal.on");if(m)closeM(m);document.body.classList.remove("lock");step(1);$("#rf").hidden=false;$("#sp").hidden=false;$("#rok").hidden=true}
 if(a.hasAttribute("data-x")){const m=a.closest(".modal");closeM(m);if(m.id=="am")render()}
 if(a.hasAttribute("data-c"))setDrawer(false)});
document.addEventListener("keydown",e=>{
 if(e.key=="Escape"){const m=$$(".modal.on").pop();if(m){closeM(m);if(m.id=="am")render()}setDrawer(false);$("#fab").classList.remove("on");return}
 if(e.key=="Tab"){const m=$(".modal.on");if(!m)return;const f=$$('a[href],button:not([disabled]),input:not([hidden]),select,textarea,summary,[tabindex]:not([tabindex="-1"])',m).filter(x=>x.offsetParent!==null);if(!f.length)return;
  const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement==first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement==last){e.preventDefault();first.focus()}}});
$$(".modal").forEach(m=>m.addEventListener("mousedown",e=>{if(e.target==m){closeM(m);if(m.id=="am")render()}}));
$("#drawer").addEventListener("click",e=>{if(e.target.id=="drawer")setDrawer(false)});
$("#burger").onclick=()=>setDrawer(true);
$("#fb").onclick=()=>{const f=$("#fab"),on=f.classList.toggle("on");$("#fb").setAttribute("aria-expanded",on)};
$("#lg").onclick=()=>{lang=lang=="fa"?"en":"fa";ls.set("nm_lang",lang);render();tick()};
$("#fd").onchange=e=>{deal=e.target.value;render()};
$("#fgo").onclick=()=>{listings();$("#list").scrollIntoView({behavior:"smooth"})};
let dbt;$("#fc").oninput=$("#fq").oninput=()=>{clearTimeout(dbt);dbt=setTimeout(listings,150)};
$("#ad").onclick=e=>{e.preventDefault();adminOpen()};
window.addEventListener("hashchange",openHash);
document.addEventListener("visibilitychange",tick);

if(window.ResizeObserver)new ResizeObserver(setStk).observe($("#stk"));else addEventListener("resize",setStk);
setStk();render();tick();setInterval(tick,30000);welcome();cloudLoad();openHash();
